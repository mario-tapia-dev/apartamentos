<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${accion} + ' Cliente'">Formulario Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="bi bi-building"></i> Apartamentos Blue
            </a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h3>
                            <i th:class="${accion == 'Crear' ? 'bi bi-plus-circle' : 'bi bi-pencil'}"></i>
                            <span th:text="${accion} + ' Cliente'">Formulario Cliente</span>
                        </h3>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post">
                            <input type="hidden" th:field="*{id}"/>

                            <!-- Información Básica -->
                            <fieldset class="border p-3 mb-4 rounded">
                                <legend class="w-auto px-2 text-primary">
                                    <i class="bi bi-person-badge"></i> Información Básica
                                </legend>

                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">
                                            <i class="bi bi-tag"></i> Tipo de Cliente *
                                        </label>
                                        <select class="form-select" th:field="*{tipo}" required>
                                            <option value="">Seleccione...</option>
                                            <option th:each="t : ${tipos}" 
                                                    th:value="${t}" 
                                                    th:text="${t}">CLIENTE</option>
                                        </select>
                                        <div class="text-danger small" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></div>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">
                                            <i class="bi bi-circle-fill"></i> Estatus *
                                        </label>
                                        <select class="form-select" th:field="*{estatus}" required>
                                            <option th:each="e : ${estatus}" 
                                                    th:value="${e}" 
                                                    th:text="${e}">ACTIVO</option>
                                        </select>
                                        <div class="text-danger small" th:if="${#fields.hasErrors('estatus')}" th:errors="*{estatus}"></div>
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">
                                            <i class="bi bi-person"></i> Nombres *
                                        </label>
                                        <input type="text" class="form-control" th:field="*{nombres}" 
                                               placeholder="Ej: Juan Carlos" required/>
                                        <div class="text-danger small" th:if="${#fields.hasErrors('nombres')}" th:errors="*{nombres}"></div>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">
                                            <i class="bi bi-person"></i> Apellidos *
                                        </label>
                                        <input type="text" class="form-control" th:field="*{apellidos}" 
                                               placeholder="Ej: García López" required/>
                                        <div class="text-danger small" th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}"></div>
                                    </div>
                                </div>
                            </fieldset>

                            <!-- Información de Contacto -->
                            <fieldset class="border p-3 mb-4 rounded">
                                <legend class="w-auto px-2 text-primary">
                                    <i class="bi bi-telephone"></i> Información de Contacto
                                </legend>

                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">
                                            <i class="bi bi-envelope"></i> Email *
                                        </label>
                                        <input type="email" class="form-control" th:field="*{email}" 
                                               placeholder="ejemplo@correo.com" required/>
                                        <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">
                                            <i class="bi bi-phone"></i> Teléfono
                                        </label>
                                        <input type="tel" class="form-control" th:field="*{telefono}" 
                                               placeholder="5512345678" maxlength="15"/>
                                        <div class="text-danger small" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold">
                                        <i class="bi bi-geo-alt"></i> Dirección
                                    </label>
                                    <textarea class="form-control" th:field="*{direccion}" rows="3" 
                                              placeholder="Calle, Número, Colonia, Ciudad, Estado"></textarea>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}"></div>
                                </div>
                            </fieldset>

                            <!-- Información Personal -->
                            <fieldset class="border p-3 mb-4 rounded">
                                <legend class="w-auto px-2 text-primary">
                                    <i class="bi bi-person-vcard"></i> Información Personal
                                </legend>

                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">
                                            <i class="bi bi-calendar"></i> Fecha de Nacimiento
                                        </label>
                                        <input type="date" class="form-control" th:field="*{fechaNacimiento}"/>
                                        <div class="text-danger small" th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors="*{fechaNacimiento}"></div>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">
                                            <i class="bi bi-credit-card-2-front"></i> Número INE
                                        </label>
                                        <input type="text" class="form-control" th:field="*{ine}" 
                                               placeholder="1234567890123" maxlength="20"/>
                                        <div class="text-danger small" th:if="${#fields.hasErrors('ine')}" th:errors="*{ine}"></div>
                                    </div>
                                </div>
                            </fieldset>

                            <!-- Información del Sistema (solo visible al editar) -->
                            <fieldset class="border p-3 mb-4 rounded bg-light" th:if="${cliente.id != null}">
                                <legend class="w-auto px-2 text-secondary">
                                    <i class="bi bi-info-circle"></i> Información del Sistema
                                </legend>
                                <div class="row">
                                    <div class="col-md-6">
                                        <p class="mb-1"><strong>ID:</strong> <span th:text="${cliente.id}">-</span></p>
                                        <p class="mb-0">
                                            <strong>Fecha de Registro:</strong> 
                                            <span th:text="${cliente.fechaRegistro != null ? #temporals.format(cliente.fechaRegistro, 'dd/MM/yyyy HH:mm:ss') : 'N/A'}">-</span>
                                        </p>
                                    </div>
                                </div>
                            </fieldset>

                            <!-- Botones -->
                            <div class="d-flex gap-2 justify-content-end">
                                <a class="btn btn-secondary" th:href="@{/clientes}">
                                    <i class="bi bi-x-circle"></i> Cancelar
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i th:class="${accion == 'Crear' ? 'bi bi-save' : 'bi bi-check-circle'}"></i>
                                    <span th:text="${accion == 'Crear' ? 'Guardar' : 'Actualizar'}">Guardar</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
